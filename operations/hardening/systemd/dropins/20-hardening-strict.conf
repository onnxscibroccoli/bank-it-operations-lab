# /etc/systemd/system/<unit>.service.d/20-hardening-strict.conf  (EXAMPLE)
# Strict profile layered on top of 10-hardening-baseline.conf for network services that
# write only to their own state/log/runtime directories. Needs systemd >= 247.
# Likely to break: JIT runtimes (MemoryDenyWriteExecute), services that fork helpers needing
# extra capabilities, services writing outside StateDirectory=/LogsDirectory=.
[Service]
ProtectSystem=strict
ProtectHome=yes
StateDirectory=bank-lab-app
LogsDirectory=bank-lab-app
RuntimeDirectory=bank-lab-app
UMask=0027
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryDenyWriteExecute=yes
RemoveIPC=yes
IPAddressDeny=any
IPAddressAllow=localhost
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM

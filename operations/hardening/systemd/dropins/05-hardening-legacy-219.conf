# /etc/systemd/system/<unit>.service.d/05-hardening-legacy-219.conf  (EXAMPLE)
# Subset that systemd 219 (RHEL/CentOS 7, Amazon Linux 2) understands. Use INSTEAD of the 10-/20-
# drop-ins on those hosts: newer directives are ignored there with only a log warning, so they
# would look applied in review but protect nothing. Pair with a migration plan off EL7/AL2.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=full
ProtectHome=read-only
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_BOOT CAP_SYS_TIME CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_READ_SEARCH CAP_LINUX_IMMUTABLE CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_SYSLOG CAP_MKNOD
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
UMask=0027

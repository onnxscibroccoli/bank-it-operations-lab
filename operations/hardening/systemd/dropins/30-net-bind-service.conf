# /etc/systemd/system/<unit>.service.d/30-net-bind-service.conf  (EXAMPLE)
# Opt-in exception: allow binding ports < 1024 as a non-root user. This is the ONLY capability
# re-added after 20-hardening-strict.conf empties the bounding set. Needs systemd >= 229.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE

# /etc/systemd/system/<unit>.service.d/10-hardening-baseline.conf  (EXAMPLE)
# Low-breakage baseline for most long-running daemons. Needs systemd >= 242
# (RHEL 9 / AL2023 / Ubuntu 20.04+ / Debian 11+). RHEL 8 (239): use 05-hardening-legacy-219.conf
# plus the 232-era lines below, or check COMPATIBILITY.md. Review per service before rollout.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=full
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native

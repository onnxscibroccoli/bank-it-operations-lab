name: portfolio-validation
on:
  push:
    branches: ['delivery/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full offline portfolio suite
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate-all.sh --python-only 2>&1 | tee portfolio-offline.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolio-offline-${{ github.sha }}
          path: portfolio-offline.log
          retention-days: 7
  backup-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    defaults:
      run:
        working-directory: backup/aws
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run synth
  package:
    needs: [offline, backup-static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Package exact validated source tree
        shell: bash
        run: |
          mkdir -p delivery-artifact
          git archive --format=zip --prefix=bank-it-operations-lab/ HEAD > delivery-artifact/portfolio.zip
          git rev-parse HEAD > delivery-artifact/COMMIT.txt
          printf '%s\n' 'DRAFT PORTFOLIO: validated by portfolio-validation only; not independently approved or merge-eligible. No live deployment.' > delivery-artifact/STATUS.txt
          cd delivery-artifact
          sha256sum portfolio.zip COMMIT.txt STATUS.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-package-${{ github.sha }}
          path: delivery-artifact/
          retention-days: 7

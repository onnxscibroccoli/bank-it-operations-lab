name: Engineering evidence contract verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Execute and strictly verify portfolio evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify schema file parses
        run: python3 -m json.tool schemas/portfolio-evidence-v1.schema.json >/dev/null
      - name: Execute real negative controls and capture machine report
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/run_evidence_suite.py
      - name: Emit new strict evidence from measured test report
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/ci/emit_evidence.py \
            --repo-root . \
            --evidence-dir evidence-out \
            --report report.json \
            --artifact unittest.log \
            --module portfolio-evidence-v1 \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$PR_HEAD_SHA" \
            --base-sha "$PR_BASE_SHA" \
            --check-id contract-regressions \
            --command-id python-unittest-negative-controls \
            --config coordination/modules.json \
            --config .github/workflows/engineering-evidence.yml \
            --retention-days 7 \
            --out evidence-out/manifest.json
      - name: Independently verify artifacts and exact CI identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/ci/verify_evidence.py evidence-out/manifest.json \
            --repo-root . \
            --evidence-dir evidence-out \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-candidate-sha "$PR_HEAD_SHA" \
            --expected-tested-sha "$GITHUB_SHA" \
            --expected-base-sha "$PR_BASE_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event "$GITHUB_EVENT_NAME"
      - name: Publish evidence, including failure diagnostics when available
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-out/
          retention-days: 7
          if-no-files-found: warn

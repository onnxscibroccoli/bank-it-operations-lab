name: postgres-restore-evidence

on:
  push:
    branches: [main, ci-evidence-postgres, overnight/integration]
    paths:
      - ".github/workflows/postgres-restore-evidence.yml"
      - "evidence/postgres/**"
      - "evidence/shared/**"
      - "tests/integration/**"
  pull_request:
    branches: [main, overnight/integration]
    paths:
      - ".github/workflows/postgres-restore-evidence.yml"
      - "evidence/postgres/**"
      - "evidence/shared/**"
      - "tests/integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Belt and braces: no cloud credentials are ever used by this workflow.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  restore-exercise-service:
    name: restore exercise (postgres service container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18 # must match the runner's preinstalled client major (pg_dump 18 on ubuntu-latest)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # ephemeral CI-only container, not a secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RUN_LABEL: ci-service-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run backup/restore scenario (exit code preserved)
        id: scenario
        run: |
          set +e
          bash tests/integration/postgres/run_restore_scenario.sh service
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "scenario exit code: $rc"
      - name: Verify evidence hashes and results
        id: verify
        if: always()
        run: |
          set +e
          bash tests/integration/postgres/verify_evidence.sh "evidence/postgres/runs/$RUN_LABEL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Negative tests failed for the intended reason (evidence/shared)
        id: negatives
        if: always()
        run: |
          set +e
          python3 evidence/shared/validate_evidence.py postgres-negatives "evidence/postgres/runs/$RUN_LABEL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          f="evidence/postgres/runs/$RUN_LABEL/SUMMARY.md"
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "no SUMMARY.md produced" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (always, including failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: postgres-evidence-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/postgres/runs/${{ env.RUN_LABEL }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail job if scenario or verification failed
        if: always()
        run: |
          echo "scenario rc=${{ steps.scenario.outputs.rc }} verify rc=${{ steps.verify.outputs.rc }} negatives rc=${{ steps.negatives.outputs.rc }}"
          [ "${{ steps.scenario.outputs.rc }}" = "0" ] && [ "${{ steps.verify.outputs.rc }}" = "0" ] && [ "${{ steps.negatives.outputs.rc }}" = "0" ]

  restore-exercise-offline:
    name: restore exercise (offline, unix-socket-only cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_LABEL: ci-offline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show preinstalled PostgreSQL binaries
        run: ls -d /usr/lib/postgresql/*/bin && ls /usr/lib/postgresql/*/bin | grep -E '^(initdb|pg_ctl|pg_dump|pg_restore|psql)$'
      - name: Run backup/restore scenario offline (exit code preserved)
        id: scenario
        run: |
          set +e
          unset PGHOST PGPORT PGUSER PGPASSWORD
          bash tests/integration/postgres/run_restore_scenario.sh offline
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "scenario exit code: $rc"
      - name: Verify evidence hashes and results
        id: verify
        if: always()
        run: |
          set +e
          bash tests/integration/postgres/verify_evidence.sh "evidence/postgres/runs/$RUN_LABEL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Negative tests failed for the intended reason (evidence/shared)
        id: negatives
        if: always()
        run: |
          set +e
          python3 evidence/shared/validate_evidence.py postgres-negatives "evidence/postgres/runs/$RUN_LABEL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          f="evidence/postgres/runs/$RUN_LABEL/SUMMARY.md"
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "no SUMMARY.md produced" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (always, including failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: postgres-evidence-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/postgres/runs/${{ env.RUN_LABEL }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail job if scenario or verification failed
        if: always()
        run: |
          echo "scenario rc=${{ steps.scenario.outputs.rc }} verify rc=${{ steps.verify.outputs.rc }} negatives rc=${{ steps.negatives.outputs.rc }}"
          [ "${{ steps.scenario.outputs.rc }}" = "0" ] && [ "${{ steps.verify.outputs.rc }}" = "0" ] && [ "${{ steps.negatives.outputs.rc }}" = "0" ]

  # The former cdk-synth job was removed at integration: CDK apps are covered by .github/workflows/aws-cdk.yml
  # (pinned local aws-cdk, no CDK_DEFAULT_ACCOUNT/REGION, cdk-nag gate). See reports/INTEGRATION.md.
